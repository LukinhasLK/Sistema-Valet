# Park Flash — site Angular + API em 127.0.0.1:8081
# __DOMINIO__ é trocado pelos scripts (homologação: srv1637921.hstgr.cloud).
# O certbot acrescenta o HTTPS a este bloco.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    root /var/www/parkflash;
    index index.html;
    client_max_body_size 3m;   # comprovantes de pagamento (limite da API: 2 MB)

    # Só /api vai para o Spring Boot (Swagger fica de fora da internet)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Sempre revalidar: assim os navegadores pegam a versão nova após cada deploy
    location = /index.html     { add_header Cache-Control "no-cache"; }
    location = /push-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # JS/CSS do Angular têm hash no nome: cache de 1 ano
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Imagens/vídeo de public/ não têm hash: cache curto
    location ~* \.(?:png|jpg|svg|ico|mp4|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Rotas do Angular (/app/fichas, etc.) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
