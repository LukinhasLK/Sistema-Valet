spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parkflash}
    username: ${DB_USUARIO:parkflash}
    password: ${DB_SENHA:parkflash}

  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

parkflash:
  pix-segredo: ${PIX_SEGREDO:}
  jwt:
    # Fora do ambiente de desenvolvimento o segredo é obrigatório (sem valor padrão).
    segredo: ${JWT_SEGREDO}

# Mapa da API (Swagger) só em desenvolvimento.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
