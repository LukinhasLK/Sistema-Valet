# ====================================================
# Configurações da aplicação ValetGest
# ====================================================

spring.application.name=valetgest
server.port=8080

# ====================================================
# Perfil ativo — "local" carrega application-local.properties
# (arquivo fora do git, com as credenciais reais). Sem ele,
# a aplicação sobe com H2 em memória (valores abaixo).
# ====================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ====================================================
# Banco de dados — padrão H2 em memória (dev/CI).
# Em produção, defina as variáveis de ambiente abaixo
# (ou use um profile) para apontar para o PostgreSQL.
# ====================================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:valetgest}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# ====================================================
# JPA / Hibernate
# ====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ====================================================
# JWT — troque em produção via variável de ambiente JWT_SECRET
# ====================================================
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-32chars-min}
jwt.expiration=86400000

# ====================================================
# Logging
# ====================================================
logging.level.com.valetgest=INFO
